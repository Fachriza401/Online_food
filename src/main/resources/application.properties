# =====================================================================
# SISTEM PEMESANAN MAKANAN ONLINE
# Profil default: H2 mode-MySQL (zero-config untuk demo)
# Untuk MySQL produksi: jalankan dengan -Dspring-boot.run.profiles=mysql
# =====================================================================
spring.application.name=online-food-ordering
server.port=8080

# ---------- Koneksi database (default: H2 task-local file) ----------
spring.datasource.url=jdbc:h2:file:./data/fooddb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# DDL otomatis produksi schema (lihat docs/DATABASE.md), aktikan H2 console saat dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.maximum-pool-size=20

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- Upload foto admin (terpisah dari aset statis bawaan) ----------
app.upload-dir=./uploads
app.upload-url=/uploads/**
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console