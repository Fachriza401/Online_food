# =====================================================================
# Profil produksi / MySQL
# Jalankan: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# =====================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/food_ordering?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Jakarta&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.maximum-pool-size=20
spring.h2.console.enabled=false