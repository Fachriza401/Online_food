<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body>
<th:block th:replace="~{fragments/navbar}"></th:block>

<div class="auth-wrap">
    <div class="auth-card">
        <h1 class="auth-title">Selamat Datang
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-4px"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        </h1>
        <p class="auth-sub">Masuk untuk memesan makanan favoritmu.</p>

        <div class="alert alert-danger" th:if="${error}"
             th:text="'Username atau kata sandi salah.'">Gagal login.</div>
        <div class="alert alert-success" th:if="${param.registered}">Pendaftaran berhasil. Silakan login.</div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" type="text" id="username" name="username" required autofocus
                       placeholder="mis. admin atau customer">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Kata Sandi</label>
                <input class="form-control" type="password" id="password" name="password" required
                       placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Masuk</button>
        </form>

        <p class="auth-foot">Belum punya akun? <a href="/register">Daftar sekarang</a></p>
        <p class="auth-foot" style="margin-top:4px;font-size:12.5px">
            Demo: <code>admin/admin123</code> (admin) ·
            <code>customer/customer123</code> (pelanggan)
        </p>
    </div>
</div>

<th:block th:replace="~{fragments/footer}"></th:block>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
