<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Daftar')}"></head>
<body>
<th:block th:replace="~{fragments/navbar}"></th:block>

<div class="auth-wrap">
    <div class="auth-card" style="max-width:520px">
        <h1 class="auth-title">Buat Akun Baru</h1>
        <p class="auth-sub">Bergabunglah dan nikmati kemudahan memesan makanan.</p>

        <div class="alert alert-danger" th:if="${registerError}" th:text="${registerError}">Error</div>

        <form th:action="@{/register}" th:object="${registerRequest}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-group">
                <label class="form-label" for="fullName">Nama Lengkap</label>
                <input class="form-control" type="text" id="fullName" th:field="*{fullName}" required placeholder="Nama lengkap">
                <p class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
            </div>
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input class="form-control" type="text" id="username" th:field="*{username}" required placeholder="min. 3 karakter">
                <p class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input class="form-control" type="email" id="email" th:field="*{email}" required placeholder="nama@email.com">
                <p class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
            </div>
            <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
                <div class="form-group">
                    <label class="form-label" for="password">Kata Sandi</label>
                    <input class="form-control" type="password" id="password" th:field="*{password}" required placeholder="min. 6 karakter">
                    <p class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Ulangi Sandi</label>
                    <input class="form-control" type="password" id="confirmPassword" th:field="*{confirmPassword}" required>
                    <p class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="phone">No. Telepon <span style="font-weight:400;color:var(--text-secondary)">(opsional)</span></label>
                <input class="form-control" type="tel" id="phone" th:field="*{phone}" placeholder="08xxxxxxxxxx">
            </div>
            <div class="form-group">
                <label class="form-label" for="address">Alamat <span style="font-weight:400;color:var(--text-secondary)">(opsional)</span></label>
                <textarea class="form-control" id="address" th:field="*{address}" placeholder="Alamat lengkap untuk pengantaran"></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Daftar</button>
        </form>

        <p class="auth-foot">Sudah punya akun? <a href="/login">Masuk</a></p>
    </div>
</div>

<th:block th:replace="~{fragments/footer}"></th:block>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
