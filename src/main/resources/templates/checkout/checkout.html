<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Checkout')}"></head>
<body>
<th:block th:replace="~{fragments/navbar}"></th:block>
<th:block th:replace="~{fragments/alerts}"></th:block>

<div class="page-head">
    <div class="container">
        <nav class="breadcrumb">
            <a href="/">Beranda</a> <span class="sep">/</span>
            <a href="/cart">Keranjang</a> <span class="sep">/</span> <span>Checkout</span>
        </nav>
        <h2 class="page-title">Checkout</h2>
    </div>
</div>

<section class="section" style="padding-top:18px">
    <div class="container">
        <div class="cart-layout">
            <div>
                <form th:action="@{/checkout}" th:object="${checkoutRequest}" method="post" id="checkoutForm">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px">
                        <h3 style="margin:0 0 18px;font-size:19px;display:flex;align-items:center;gap:8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> Informasi Pengiriman</h3>
                        <div class="form-group">
                            <label class="form-label" for="customerName">Nama Penerima</label>
                            <input class="form-control" type="text" id="customerName" th:field="*{customerName}" required>
                            <p class="invalid-feedback" th:if="${#fields.hasErrors('customerName')}" th:errors="*{customerName}"></p>
                        </div>
                        <div class="form-row" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
                            <div class="form-group">
                                <label class="form-label" for="customerPhone">No. Telepon</label>
                                <input class="form-control" type="tel" id="customerPhone" th:field="*{customerPhone}" required placeholder="08xxxxxxxxxx">
                                <p class="invalid-feedback" th:if="${#fields.hasErrors('customerPhone')}" th:errors="*{customerPhone}"></p>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="customerAddress">Alamat Pengiriman</label>
                            <textarea class="form-control" id="customerAddress" th:field="*{customerAddress}" required
                                      placeholder="Alamat lengkap: jalan, nomor rumah, kecamatan, kota"></textarea>
                            <p class="invalid-feedback" th:if="${#fields.hasErrors('customerAddress')}" th:errors="*{customerAddress}"></p>
                        </div>
                        <div class="form-group" style="margin-bottom:0">
                            <label class="form-label" for="note">Catatan <span style="font-weight:400;color:var(--text-secondary)">(opsional)</span></label>
                            <textarea class="form-control" id="note" th:field="*{note}"
                                      placeholder="Mis. tingkat pedas, tidak pakai kerupuk, dst."></textarea>
                        </div>
                    </div>

                    <div style="background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px">
                        <h3 style="margin:0 0 14px;font-size:19px;display:flex;align-items:center;gap:8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Metode Pembayaran</h3>
                        <label class="form-check" style="padding:14px;border:1.5px solid var(--primary);background:var(--primary-soft);border-radius:var(--radius-sm)">
                            <input type="radio" checked>
                            <div>
                                <strong>Bayar di Tempat (COD)</strong>
                                <div style="font-size:12.5px;color:var(--text-secondary)">Pembayaran dilakukan saat pesanan tiba. Tanpa pembayaran di muka.</div>
                            </div>
                        </label>
                        <p class="form-hint" style="margin-top:10px">Pilihan pembayaran digital akan diintegrasikan pada tahap selanjutnya.</p>
                    </div>
                </form>
            </div>

            <aside class="summary-card">
                <h3 style="margin:0 0 10px;font-size:19px">Ringkasan Pesanan</h3>
                <div th:each="item : ${cart.items}" style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--border)">
                    <span style="color:var(--text-secondary)"><strong th:text="${item.quantity}">1</strong> × <span th:text="${item.food.name}">Nama</span></span>
                    <span>Rp <span th:text="${#numbers.formatInteger(item.subtotal, 3, 'POINT')}">0</span></span>
                </div>
                <div class="summary-row"><span>Subtotal</span>
                    <span>Rp <span th:text="${#numbers.formatInteger(cart.subtotal, 3, 'POINT')}">0</span></span></div>
                <div class="summary-row"><span>Ongkir</span>
                    <span th:if="${shippingFee > 0}">Rp <span th:text="${#numbers.formatInteger(shippingFee, 3, 'POINT')}">10.000</span></span>
                    <span th:unless="${shippingFee > 0}">Gratis</span></div>
                <div class="summary-row total"><span>Total</span>
                    <span>Rp <span th:text="${#numbers.formatInteger(total, 3, 'POINT')}">0</span></span></div>
                <button type="submit" form="checkoutForm" class="btn btn-success btn-block" style="margin-top:16px;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    Konfirmasi Pesanan
                </button>
                <a href="/cart" class="btn btn-outline btn-block" style="margin-top:10px">Kembali ke Keranjang</a>
            </aside>
        </div>
    </div>
</section>

<th:block th:replace="~{fragments/footer}"></th:block>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
