<div th:fragment="floatingCart" class="floating-cart" id="floatingCart"
     th:if="${isCustomer}"
     th:classappend="${cartCount > 0} ? 'is-visible'"
     th:attr="data-cart-url=@{/cart}">
    <a class="floating-cart-btn" th:href="@{/cart}" title="Buka keranjang" aria-label="Buka keranjang">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        <span class="floating-cart-count" id="floatingCartCount" th:text="${cartCount}">0</span>
    </a>
    <div class="floating-cart-info">
        <span class="floating-cart-label">Keranjang</span>
        <strong class="floating-cart-total">Rp <span id="floatingCartTotal"
                th:text="${#numbers.formatInteger(cartTotal, 3, 'POINT')}">0</span></strong>
    </div>
    <a class="btn btn-primary btn-sm floating-cart-view" th:href="@{/cart}">Lihat</a>
</div>
