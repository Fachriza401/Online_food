<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<body>
<span th:fragment="stars(score)" class="stars">
    <span class="stars-base" aria-hidden="true">★★★★★</span>
    <span class="stars-fill" aria-hidden="true"
          th:style="'width:' + ${#numbers.formatDecimal(score / 5.0 * 100, 1, 1)} + '%'">★★★★★</span>
</span>
</body>
</html>
