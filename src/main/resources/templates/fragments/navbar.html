<nav class="navbar" th:fragment="navbar">
    <div class="container navbar-inner">
        <button class="hamburger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>

        <a class="brand" href="/">
            <img src="/images/branding/logo.png" alt="Toko Kita" width="44" height="44">
            <span>Toko<span class="accent">Kita</span></span>
        </a>

        <ul class="nav-links">
            <li><a th:href="@{/}" th:classappend="${activePage == 'home'} ? 'active'">Beranda</a></li>
            <li><a th:href="@{/menu}"
                   th:classappend="${activePage != null and #strings.startsWith(activePage, 'menu')} ? 'active'">Menu</a></li>
            <li><a th:href="@{/#tentang}" th:classappend="${activePage == 'about'} ? 'active'">Tentang Kami</a></li>
            <li sec:authorize="hasRole('CUSTOMER')"><a th:href="@{/orders}"
                   th:classappend="${activePage != null and #strings.startsWith(activePage, 'orders')} ? 'active'">Pesanan</a></li>
            <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/admin}" class="btn btn-ghost btn-sm" style="margin:0">Admin Panel</a></li>
        </ul>

        <div class="nav-actions">
            <a class="cart-icon-btn" th:href="@{/cart}" title="Keranjang" sec:authorize="isAuthenticated()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
                <span class="cart-count" th:if="${cartCount > 0}" th:text="${cartCount}">0</span>
            </a>

            <th:block sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="btn btn-outline">Login</a>
                <a th:href="@{/register}" class="btn btn-primary">Daftar</a>
            </th:block>

            <th:block sec:authorize="isAuthenticated()">
                <div class="notif" id="notifWrap">
                    <button class="notif-btn" id="notifBtn" type="button" aria-label="Notifikasi">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                        <span class="notif-badge" th:if="${notifUnread != null and notifUnread > 0}" th:text="${notifUnread}">0</span>
                    </button>
                    <div class="notif-panel" id="notifPanel">
                        <div class="notif-head">
                            <strong>Notifikasi</strong>
                            <form th:action="@{/notifications/read-all}" method="post" style="margin:0">
                                <button type="submit" class="notif-readall">Tandai semua dibaca</button>
                            </form>
                        </div>
                        <div class="notif-list" id="notifList">
                            <a class="notif-item" th:each="n : ${notifList}" th:href="${n.link}">
                                <span class="notif-dot" th:if="${!n.read}"></span>
                                <span class="notif-text">
                                    <span th:text="${n.message}">pesan</span>
                                    <small th:text="${#temporals.format(n.createdAt, 'dd MMM HH:mm')}">waktu</small>
                                </span>
                            </a>
                            <div class="notif-empty" th:if="${#lists.isEmpty(notifList)}">Belum ada notifikasi.</div>
                        </div>
                    </div>
                </div>

                <a class="user-chip" th:href="@{/profile}" title="Profil saya">
                    <span class="avatar" style="overflow:hidden">
                        <img th:if="${currentUser != null and currentUser.avatarUrl != null}"
                             th:src="${currentUser.avatarUrl}" class="avatar-img" alt="Foto profil" style="width:100%;height:100%">
                        <span th:unless="${currentUser == null or currentUser.avatarUrl == null}"
                              th:text="${#strings.substring(#strings.toUpperCase(currentUsername),0,1)}">U</span>
                    </span>
                    <span style="font-weight:600;font-size:14px" th:text="${currentUsername}">user</span>
                </a>
                <form th:action="@{/logout}" method="post" style="display:inline;margin:0">
                    <button type="submit" class="btn btn-ghost btn-sm" style="border:none;cursor:pointer">Keluar</button>
                </form>
            </th:block>
        </div>
    </div>
</nav>
