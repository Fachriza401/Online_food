<th:block th:fragment="navbar">
<nav class="navbar">
    <div class="container navbar-inner">
        <button class="hamburger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>

        <a class="brand" th:href="@{/}" th:attr="aria-label=${restaurantName} + ' — beranda'">
            <img th:src="${restaurantLogo}" th:alt="${restaurantName}" width="44" height="44">
            <span th:text="${restaurantName}">RM KAK ROS</span>
        </a>

        <ul class="nav-links">
            <li><a th:href="@{/}" th:classappend="${activePage == 'home'} ? 'active'">Beranda</a></li>
            <li><a th:href="@{/menu}"
                   th:classappend="${activePage != null and #strings.startsWith(activePage, 'menu')} ? 'active'">Menu</a></li>
            <li><a th:href="@{/#tentang}" th:classappend="${activePage == 'about'} ? 'active'">Tentang Kami</a></li>
            <li sec:authorize="hasRole('CUSTOMER')"><a th:href="@{/orders}"
                   th:classappend="${activePage != null and #strings.startsWith(activePage, 'orders')} ? 'active'">Pesanan</a></li>
            <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/admin}" class="btn btn-ghost btn-sm" style="margin:0">Admin Panel</a></li>
            <li class="mobile-auth-links" sec:authorize="!isAuthenticated()">
                <div class="mobile-auth-actions">
                    <a th:href="@{/login}" class="btn btn-outline">Login</a>
                    <a th:href="@{/register}" class="btn btn-primary">Daftar</a>
                </div>
            </li>
            <li class="mobile-logout-link" sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-ghost btn-sm">Keluar</button>
                </form>
            </li>
        </ul>

        <div class="nav-actions">
            <a class="cart-icon-btn" th:href="@{/cart}" title="Keranjang" sec:authorize="isAuthenticated()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
                <span class="cart-count" th:if="${cartCount > 0}" th:text="${cartCount}">0</span>
            </a>

            <th:block sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="btn btn-outline">Login</a>
                <a th:href="@{/register}" class="btn btn-primary">Daftar</a>
            </th:block>

            <th:block sec:authorize="isAuthenticated()">
                <div class="notif" id="notifWrap">
                    <button class="notif-btn" id="notifBtn" type="button" aria-label="Notifikasi">
                        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                        <span class="notif-badge" th:if="${notifUnread != null and notifUnread > 0}" th:text="${notifUnread}">0</span>
                    </button>
                    <div class="notif-panel" id="notifPanel">
                        <div class="notif-head">
                            <strong>Notifikasi</strong>
                            <form th:action="@{/notifications/read-all}" method="post" style="margin:0">
                                <button type="submit" class="notif-readall">Tandai semua dibaca</button>
                            </form>
                        </div>
                        <div class="notif-list" id="notifList">
                            <a class="notif-item" th:each="n : ${notifList}" th:href="${n.link}">
                                <span class="notif-dot" th:if="${!n.read}"></span>
                                <span class="notif-text">
                                    <span th:text="${n.message}">pesan</span>
                                    <small th:text="${#temporals.format(n.createdAt, 'dd MMM HH:mm')}">waktu</small>
                                </span>
                            </a>
                            <div class="notif-empty" th:if="${#lists.isEmpty(notifList)}">Belum ada notifikasi.</div>
                        </div>
                    </div>
                </div>

                <a class="user-chip" th:href="@{/profile}" title="Profil saya">
                    <span class="avatar" style="overflow:hidden">
                        <img th:if="${currentUser != null and currentUser.avatarUrl != null}"
                             th:src="${currentUser.avatarUrl}" class="avatar-img" alt="Foto profil" style="width:100%;height:100%">
                        <span th:if="${currentUser == null or currentUser.avatarUrl == null}"
                              th:text="${#strings.substring(#strings.toUpperCase(currentUsername),0,1)}">U</span>
                    </span>
                    <span style="font-weight:600;font-size:14px" th:text="${currentUsername}">user</span>
                </a>
                <form class="desktop-logout" th:action="@{/logout}" method="post" style="display:inline;margin:0">
                    <button type="submit" class="btn btn-ghost btn-sm" style="border:none;cursor:pointer">Keluar</button>
                </form>

                <div class="mobile-account" id="mobileAccount" sec:authorize="isAuthenticated()">
                    <button class="mobile-account-trigger" id="mobileAccountBtn" type="button"
                            aria-label="Buka menu akun" aria-expanded="false">
                        <span class="avatar" style="overflow:hidden">
                            <img th:if="${currentUser != null and currentUser.avatarUrl != null}"
                                 th:src="${currentUser.avatarUrl}" class="avatar-img" alt="" style="width:100%;height:100%">
                            <span th:if="${currentUser == null or currentUser.avatarUrl == null}"
                                  th:text="${#strings.substring(#strings.toUpperCase(currentUsername),0,1)}">U</span>
                        </span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                    </button>
                    <div class="mobile-account-dropdown" id="mobileAccountDropdown">
                        <div class="mobile-account-name" th:text="${currentUser != null ? currentUser.fullName : currentUsername}">Customer</div>

                        <a th:href="@{/cart}">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                            <span>Keranjang</span>
                            <span class="mobile-account-meta" th:if="${cartCount > 0}">
                                <small style="color:var(--text-secondary);font-size:12px">Rp&nbsp;<span
                                        th:text="${#numbers.formatInteger(cartTotal, 3, 'POINT')}">0</span></small>
                                <span class="mobile-account-count" id="mobileCartCount" th:text="${cartCount}">0</span>
                            </span>
                            <span class="mobile-account-meta" th:if="${cartCount == 0}">
                                <small style="color:var(--text-secondary);font-size:12px">Kosong</small>
                            </span>
                        </a>

                        <div class="mobile-account-separator"></div>
                        <div class="mobile-notif-block">
                            <div class="mobile-notif-head">
                                <strong>Notifikasi Terbaru</strong>
                                <form th:action="@{/notifications/read-all}" method="post" style="margin:0">
                                    <button type="submit" class="notif-readall">Tandai semua dibaca</button>
                                </form>
                            </div>
                            <div class="mobile-notif-list" id="mobileNotifList">
                                <a class="notif-item" th:each="n : ${notifList}" th:href="${n.link}">
                                    <span class="notif-dot" th:if="${!n.read}"></span>
                                    <span class="notif-text">
                                        <span th:text="${n.message}">pesan</span>
                                        <small th:text="${#temporals.format(n.createdAt, 'dd MMM HH:mm')}">waktu</small>
                                    </span>
                                </a>
                                <div class="notif-empty" th:if="${#lists.isEmpty(notifList)}">Belum ada notifikasi.</div>
                            </div>
                        </div>

                        <div class="mobile-account-separator"></div>
                        <a th:href="@{/profile}">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>
                            <span>Menu Akun / Profil</span>
                        </a>
                        <div class="mobile-account-separator"></div>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="mobile-account-logout">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                                Keluar
                            </button>
                        </form>
                    </div>
                </div>
            </th:block>
        </div>
    </div>
</nav>
<div class="nav-backdrop" id="navBackdrop" aria-hidden="true"></div>
<th:block th:replace="~{fragments/floating-cart :: floatingCart}"></th:block>
</th:block>
