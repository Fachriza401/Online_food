<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Riwayat Pesanan')}"></head>
<body>
<th:block th:replace="~{fragments/navbar}"></th:block>
<th:block th:replace="~{fragments/alerts}"></th:block>

<div class="page-head">
    <div class="container">
        <nav class="breadcrumb"><a href="/">Beranda</a> <span class="sep">/</span> <span>Pesanan Saya</span></nav>
        <h2 class="page-title">Riwayat Pesanan</h2>
        <p class="page-sub">Pantau status setiap pesanan yang pernah Anda buat.</p>
    </div>
</div>

<section class="section" style="padding-top:18px">
    <div class="container">
        <div class="tabs">
            <a th:href="@{/orders(tab='active')}" th:classappend="${tab == 'active'} ? 'active'">Pesanan Aktif</a>
            <a th:href="@{/orders(tab='history')}" th:classappend="${tab == 'history'} ? 'active'">Riwayat Pesanan</a>
        </div>

        <div class="table-wrap" th:if="${orders.hasContent()}">
            <table class="table">
                <thead>
                <tr>
                    <th>Kode</th>
                    <th>Tanggal</th>
                    <th>Item</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders.content}">
                    <td><strong th:text="${order.orderCode}" style="color:var(--primary-dark)">ORD-..</strong></td>
                    <td th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}">01 Jan 2025</td>
                    <td th:text="${#lists.size(order.items)} + ' item'">2 item</td>
                    <td>Rp <span th:text="${#numbers.formatInteger(order.totalAmount, 3, 'POINT')}">0</span></td>
                    <td><span class="badge" th:classappend="${order.status.badgeClass}" th:text="${order.status.label}">PENDING</span></td>
                    <td><a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-light btn-sm">Detail</a></td>
                </tr>
                </tbody>
            </table>
            <div class="pagination" th:if="${orders.totalPages > 1}">
                <a th:if="${orders.hasPrevious()}" th:href="@{/orders(tab=${tab}, page=${orders.number - 1})}">←</a>
                <span class="current" th:text="${orders.number + 1}">1</span>
                <a th:if="${orders.hasNext()}" th:href="@{/orders(tab=${tab}, page=${orders.number + 1})}">→</a>
            </div>
        </div>

        <div class="empty-state" th:unless="${orders.hasContent()}">
            <div class="icon"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg></div>
            <h3 th:text="${tab == 'history'} ? 'Belum ada riwayat pesanan' : 'Tidak ada pesanan aktif'">Belum ada pesanan</h3>
            <p th:text="${tab == 'history'} ? 'Pesanan yang sudah selesai akan otomatis muncul di sini.' : 'Mulai pesan makanan favoritmu sekarang.'">Mulai pesan makanan favoritmu sekarang.</p>
            <a href="/menu" class="btn btn-primary">Jelajahi Menu</a>
        </div>
    </div>
</section>

<th:block th:replace="~{fragments/footer}"></th:block>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
