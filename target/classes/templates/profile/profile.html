<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Profil Saya')}"></head>
<body>
<th:block th:replace="~{fragments/navbar}"></th:block>
<th:block th:replace="~{fragments/alerts}"></th:block>

<div class="page-head">
    <div class="container">
        <nav class="breadcrumb"><a href="/">Beranda</a> <span class="sep">/</span> <span>Profil</span></nav>
        <h2 class="page-title">Profil Saya</h2>
    </div>
</div>

<section class="section" style="padding-top:18px">
    <div class="container">
        <div class="cart-layout">
            <div>
                <form th:action="@{/profile}" th:object="${user}" method="post" enctype="multipart/form-data"
                      style="background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div style="display:flex;gap:18px;align-items:center;margin-bottom:22px">
                        <span class="avatar" id="avatarBox" style="width:72px;height:72px;font-size:26px;flex:none;overflow:hidden">
                            <th:block th:if="${user.avatarUrl != null}">
                                <img th:src="${user.avatarUrl}" id="avatarPreview" class="avatar-img" alt="Foto profil" style="width:100%;height:100%">
                            </th:block>
                            <th:block th:unless="${user.avatarUrl != null}">
                                <span id="avatarFallback" th:text="${#strings.substring(#strings.toUpperCase(user.username),0,1)}">U</span>
                            </th:block>
                        </span>
                        <div style="flex:1;min-width:0">
                            <strong style="font-size:18px" th:text="${user.fullName}">Nama</strong>
                            <div style="color:var(--text-secondary);font-size:13.5px" th:text="${'@' + user.username}">@user</div>
                            <label class="btn btn-outline btn-sm" for="photo" style="margin-top:10px;cursor:pointer;display:inline-flex;align-items:center;gap:8px">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                                Ganti Foto
                            </label>
                            <input type="file" id="photo" name="photo" accept="image/jpeg,image/png,image/webp" style="display:none">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="fullName">Nama Lengkap</label>
                        <input class="form-control" type="text" id="fullName" th:field="*{fullName}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="email">Email <span class="form-hint">(tidak dapat diubah)</span></label>
                        <input class="form-control" type="email" id="email" th:field="*{email}" disabled readonly
                               style="background:var(--bg)">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="phone">No. Telepon</label>
                        <input class="form-control" type="tel" id="phone" th:field="*{phone}">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="address">Alamat</label>
                        <textarea class="form-control" id="address" th:field="*{address}"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Simpan Perubahan</button>
                </form>
            </div>

            <div>
                <div class="summary-card" style="position:static">
                    <h3 style="margin:0 0 6px;font-size:18px">Keamanan</h3>
                    <p style="color:var(--text-secondary);font-size:13.5px;margin:0 0 16px">Ganti kata sandi akun Anda secara berkala.</p>
                    <form th:action="@{/profile/password}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="form-group">
                            <label class="form-label" for="oldPassword">Kata Sandi Lama</label>
                            <input class="form-control" type="password" id="oldPassword" name="oldPassword" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="newPassword">Kata Sandi Baru</label>
                            <input class="form-control" type="password" id="newPassword" name="newPassword" required minlength="6">
                        </div>
                        <button type="submit" class="btn btn-outline btn-block">Perbarui Kata Sandi</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<th:block th:replace="~{fragments/footer}"></th:block>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
