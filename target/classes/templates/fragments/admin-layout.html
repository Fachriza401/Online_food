<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="adminHead(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F97316">
    <title th:text="${title} + ' · Admin ' + ${restaurantName}">Admin</title>
    <link rel="icon" type="image/png" th:href="${restaurantLogo}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>

<aside class="sidebar" th:fragment="sidebar(active)" id="adminSidebar">
    <div class="sidebar-brand">
        <img th:src="${restaurantLogo}" th:alt="${restaurantName}" width="40" height="40">
        <span th:text="${restaurantName}">RM KAK ROS</span><small style="font-weight:500;font-size:12px;color:var(--text-secondary)"> · Admin</small>
        <button type="button" class="sidebar-close" id="adminSidebarClose" aria-label="Tutup menu navigasi">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
        </button>
    </div>
    <nav class="sidebar-nav">
        <div class="sidebar-label">Menu Utama</div>
        <a th:href="@{/admin}" th:classappend="${active == 'dashboard'} ? 'active'"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></span> Dashboard</a>
        <a th:href="@{/admin/foods}" th:classappend="${active == 'foods'} ? 'active'"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg></span> Menu Makanan</a>
        <a th:href="@{/admin/categories}" th:classappend="${active == 'categories'} ? 'active'"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span> Kategori</a>
        <a th:href="@{/admin/orders}" th:classappend="${active == 'orders'} ? 'active'"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg></span> Pesanan</a>
        <a th:href="@{/admin/customers}" th:classappend="${active == 'customers'} ? 'active'"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span> Pelanggan</a>
        <a th:href="@{/admin/reports}" th:classappend="${active == 'reports'} ? 'active'"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></span> Laporan</a>
        <a th:href="@{/admin/settings}" th:classappend="${active == 'settings'} ? 'active'"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span> Pengaturan Resto</a>
        <div class="sidebar-label">Toko</div>
        <a th:href="@{/}" ><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span> Lihat Situs</a>
    </nav>
    <div class="sidebar-foot"><span th:text="${restaurantName}">RM KAK ROS</span> · Sistem Pemesanan Makanan Online</div>
</aside>

<header class="topbar" th:fragment="topbar(title)">
    <button type="button" class="burger-admin" id="adminBurger" aria-label="Menu" aria-expanded="false" aria-controls="adminSidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <h1 th:text="${title}">Dashboard</h1>
    <div class="topbar-right">
        <div class="notif" id="notifWrap">
            <button class="notif-btn" id="notifBtn" type="button" aria-label="Notifikasi">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                <span class="notif-badge" th:if="${notifUnread != null and notifUnread > 0}" th:text="${notifUnread}">0</span>
            </button>
            <div class="notif-panel" id="notifPanel">
                <div class="notif-head">
                    <strong>Notifikasi</strong>
                    <form th:action="@{/notifications/read-all}" method="post" style="margin:0">
                        <button type="submit" class="notif-readall">Tandai semua dibaca</button>
                    </form>
                </div>
                <div class="notif-list" id="notifList">
                    <a class="notif-item" th:each="n : ${notifList}" th:href="${n.link}">
                        <span class="notif-dot" th:if="${!n.read}"></span>
                        <span class="notif-text">
                            <span th:text="${n.message}">pesan</span>
                            <small th:text="${#temporals.format(n.createdAt, 'dd MMM HH:mm')}">waktu</small>
                        </span>
                    </a>
                    <div class="notif-empty" th:if="${#lists.isEmpty(notifList)}">Belum ada notifikasi.</div>
                </div>
            </div>
        </div>

        <div class="admin-menu" id="adminMenuWrap">
            <button class="admin-menu-trigger" id="adminMenuBtn" type="button">
                <span class="admin-avatar" style="overflow:hidden">
                    <img th:if="${currentUser != null and currentUser.avatarUrl != null}"
                         th:src="${currentUser.avatarUrl}" class="avatar-img"
                         alt="Foto admin" style="width:100%;height:100%">
                    <span th:if="${currentUser == null or currentUser.avatarUrl == null}"
                          th:text="${#strings.substring(#strings.toUpperCase(currentUsername),0,1)}">A</span>
                </span>
                <span class="admin-name-wrap">
                    <span class="admin-name" th:text="${currentUser != null ? currentUser.fullName : currentUsername}">Admin</span>
                    <div class="admin-role">Administrator</div>
                </span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-secondary)"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="admin-dropdown" id="adminDropdown">
                <a th:href="@{/profile}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>
                    Pengaturan Admin
                </a>
                <a th:href="@{/}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    Lihat Situs
                </a>
                <div class="admin-dropdown-sep"></div>
                <form th:action="@{/logout}" method="post" style="margin:0">
                    <button type="submit" class="danger">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        Keluar
                    </button>
                </form>
            </div>
        </div>
    </div>
</header>

<div th:fragment="adminScripts">
    <!-- Backdrop gelap saat sidebar mobile terbuka (harus di level body,
         di luar .sidebar, agar positioning tetap relatif terhadap viewport) -->
    <div class="overlay-admin" id="adminOverlay" aria-hidden="true"></div>
    <div class="toast-container">
        <div class="toast success toast-auto" th:if="${success}" th:text="${success}"></div>
        <div class="toast error toast-auto" th:if="${error}" th:text="${error}"></div>
    </div>
    <script th:src="@{/js/admin.js}"></script>
</div>
</html>
