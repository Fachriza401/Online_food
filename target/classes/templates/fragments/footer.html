<footer class="footer" th:fragment="footer">
    <div class="container">
        <div class="footer-grid">
            <div>
                <div class="footer-brand"><span th:text="${restaurantName}">RM KAK ROS</span></div>
                <p th:text="${restaurant != null and restaurant.description != null
                    ? restaurant.description
                    : 'Website pemesanan makanan online. Pesan makanan favoritmu dengan mudah, cepat, dan aman — di antar sampai depan pintu.'}">
                    Website pemesanan makanan online.</p>
            </div>
            <div>
                <h4>Navigasi</h4>
                <a th:href="@{/}">Beranda</a>
                <a th:href="@{/menu}">Menu</a>
                <a th:href="@{/login}">Login</a>
                <a th:href="@{/register}">Daftar</a>
            </div>
            <div>
                <h4>Kontak</h4>
                <a th:if="${restaurant != null and restaurant.phone != null}"
                   th:href="'tel:' + ${#strings.replace(restaurant.phone, '-', '')}"
                   th:text="${restaurant.phone}">0853-6315-8834</a>
                <a th:if="${restaurant != null and restaurant.email != null}"
                   th:href="'mailto:' + ${restaurant.email}"
                   th:text="${restaurant.email}">halo@rmkakros.example</a>
                <a class="footer-map" target="_blank" rel="noopener noreferrer"
                   title="Buka lokasi di Google Maps"
                   th:if="${restaurant != null and restaurant.address != null}"
                   th:href="'https://www.google.com/maps/search/?api=1&amp;query=' + ${restaurant.address}">
                    <span class="footer-map-label">Lokasi</span>
                    <span class="footer-map-address" th:text="${restaurant.address}">Alamat resto</span>
                </a>
                <a href="/#tentang">Tentang Kami</a>
            </div>
        </div>
        <div class="footer-bottom">© <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2025</span> <span
                th:text="${restaurantName}">RM KAK ROS</span> — Sistem Pemesanan Makanan Online. Semua hak dilindungi.</div>
    </div>
</footer>
