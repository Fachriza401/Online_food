<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Menu Makanan')}"></head>
<body>
<div class="layout">
    <th:block th:replace="~{fragments/admin-layout :: sidebar('foods')}"></th:block>
    <div class="main">
        <th:block th:replace="~{fragments/admin-layout :: topbar('Menu Makanan')}"></th:block>
        <div class="content">
            <div class="toolbar">
                <form action="/admin/foods" method="get" style="display:contents">
                    <div class="search">
                        <input class="form-control" type="search" name="q" placeholder="Cari nama/deskripsi menu..."
                               th:value="${keyword}">
                    </div>
                    <select class="form-control" name="category" style="width:auto;min-width:160px" onchange="this.form.submit()">
                        <option value="">Semua Kategori</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}"
                                th:text="${cat.name}" th:selected="${selectedCategory == cat.id}">Kategori</option>
                    </select>
                    <button class="btn-pill primary">Cari</button>
                    <a th:if="${keyword != null or selectedCategory != null}" href="/admin/foods" class="btn-pill outline">Reset</a>
                </form>
                <a href="/admin/foods/new" class="btn-pill primary" style="margin-left:auto">+ Tambah Menu</a>
            </div>

            <div class="panel">
                <div class="table-wrap">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Nama Menu</th>
                            <th>Kategori</th>
                            <th>Harga</th>
                            <th>Status</th>
                            <th>Unggulan</th>
                            <th style="text-align:right">Aksi</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="food : ${foods}">
                            <td>
                                <img class="thumb-sm" th:src="${food.imageUrl}" th:alt="${food.name}" loading="lazy">
                            </td>
                            <td>
                                <strong th:text="${food.name}">Nama</strong>
                                <div class="table-note" style="max-width:260px" th:text="${food.description}">Deskripsi</div>
                            </td>
                            <td th:text="${food.category != null ? food.category.name : '-'}">Kategori</td>
                            <td>Rp <span th:text="${#numbers.formatInteger(food.price, 3, 'POINT')}">0</span></td>
                            <td>
                                <span class="badge" th:classappend="${food.available} ? 'badge-paid' : 'badge-cancelled'"
                                      th:text="${food.available} ? 'Tersedia' : 'Habis'">Tersedia</span>
                            </td>
                            <td>
                                <form th:action="@{/admin/foods/{id}/featured(id=${food.id})}" method="post"
                                      style="display:inline-block;margin:0">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn-pill sm"
                                            th:classappend="${food.featured} ? 'primary' : 'outline'"
                                            th:title="${food.featured} ? 'Klik untuk menghapus dari Menu Unggulan' : 'Klik untuk jadikan Menu Unggulan'"
                                            th:text="${food.featured} ? '★ Unggulan' : '☆ Unggulan'">☆ Unggulan</button>
                                </form>
                            </td>
                            <td style="text-align:right;white-space:nowrap">
                                <a th:href="@{/admin/foods/{id}/edit(id=${food.id})}" class="btn-pill outline sm">Edit</a>
                                <form th:action="@{/admin/foods/{id}/delete(id=${food.id})}" method="post"
                                      style="display:inline-block;margin:0">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="btn-pill danger sm"
                                            th:data-confirm="'Hapus menu \'' + ${food.name} + '\'? Tindakan ini tidak dapat dibatalkan.'">Hapus</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(foods)}">
                            <td colspan="7" class="table-note" style="text-align:center;padding:30px">
                                Belum ada menu. <a href="/admin/foods/new">Tambahkan menu pertama</a>.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/admin-layout :: adminScripts}"></th:block>
</body>
</html>
