<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/admin-layout :: adminHead('Dashboard')}"></head>
<body>
<div class="layout">
    <th:block th:replace="~{fragments/admin-layout :: sidebar('dashboard')}"></th:block>

    <div class="main">
        <th:block th:replace="~{fragments/admin-layout :: topbar('Dashboard')}"></th:block>

        <div class="content">
            <div class="stat-grid">
                <div class="stat-card">
                    <span class="stat-icon orange"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg></span>
                    <div>
                        <div class="stat-value" th:text="${stats['menuCount']}">0</div>
                        <div class="stat-label">Total Menu</div>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="stat-icon blue"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0369A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg></span>
                    <div>
                        <div class="stat-value" th:text="${stats['orderCount']}">0</div>
                        <div class="stat-label">Total Pesanan</div>
                        <div class="stat-sub" th:text="${stats['pendingCount']} + ' menunggu konfirmasi'">0 menunggu</div>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="stat-icon green"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></span>
                    <div>
                        <div class="stat-value">Rp <span
                                th:text="${#numbers.formatInteger(stats['revenue'], 3, 'POINT')}">0</span></div>
                        <div class="stat-label">Pendapatan (non-batal)</div>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="stat-icon purple"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6D28D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>
                    <div>
                        <div class="stat-value" th:text="${stats['customerCount']}">0</div>
                        <div class="stat-label">Total Pelanggan</div>
                    </div>
                </div>
            </div>

            <div class="dash-grid">
                <div class="panel">
                    <div class="panel-head">
                        <h3 class="panel-title">Pesanan Terbaru</h3>
                        <a href="/admin/orders" class="btn-pill outline">Lihat Semua →</a>
                    </div>
                    <div class="table-wrap">
                        <table class="table">
                            <thead>
                            <tr>
                                <th>Kode</th>
                                <th>Pelanggan</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="order : ${recentOrders}">
                                <td><strong th:text="${order.orderCode}" style="color:var(--primary-dark)">ORD-..</strong></td>
                                <td th:text="${order.customerName}">Nama</td>
                                <td>Rp <span th:text="${#numbers.formatInteger(order.totalAmount, 3, 'POINT')}">0</span></td>
                                <td><span class="badge" th:classappend="${order.status.badgeClass}" th:text="${order.status.label}">status</span></td>
                                <td><a th:href="@{/admin/orders/{id}(id=${order.id})}" class="btn-pill outline sm">Detail</a></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(recentOrders)}">
                                <td colspan="5" class="table-note" style="text-align:center;padding:28px">Belum ada pesanan.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-head"><h3 class="panel-title">Pesanan per Status</h3></div>
                    <div class="panel-body">
                        <div class="chart-box"><canvas id="statusChart"></canvas></div>
                        <div class="chip-row" style="margin-top:16px">
                            <span class="chip" th:each="entry : ${ordersByStatus}" style="display:inline-flex;align-items:center;gap:8px">
                                <span class="badge" th:classappend="${entry.key.badgeClass}" th:text="${entry.key.label}">Status</span>
                                <strong th:text="${entry.value}">0</strong>
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="panel" style="margin-top:18px">
                <div class="panel-head"><h3 class="panel-title">Penjualan 7 Hari Terakhir</h3></div>
                <div class="panel-body">
                    <div class="chart-box chart-lg"><canvas id="salesChart"></canvas></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script th:inline="javascript">
(function () {
  if (typeof Chart === "undefined") return;

  var statusColors = ["#F59E0B", "#0EA5E9", "#CA8A04", "#8B5CF6", "#22C55E", "#EF4444"];
  var statusLabels = [];
  var statusValues = [];
  /*[# th:each="e : ${ordersByStatus}"]*/
  statusLabels.push(/*[[${e.key.label}]]*/ "");
  statusValues.push(/*[[${e.value}]]*/ 0);
  /*[/]*/

  new Chart(document.getElementById("statusChart"), {
    type: "doughnut",
    data: {
      labels: statusLabels,
      datasets: [{
        data: statusValues,
        backgroundColor: statusColors,
        borderColor: "#ffffff",
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: "62%",
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function (ctx) {
              return " " + ctx.label + ": " + ctx.parsed + " pesanan";
            }
          }
        }
      }
    }
  });

  var barLabels = [];
  var barValues = [];
  /*[# th:each="r : ${salesBar}"]*/
  barLabels.push(/*[[${#temporals.format(r[0], 'dd MMM')}]]*/ "");
  barValues.push(/*[[${r[1]}]]*/ 0);
  /*[/]*/

  new Chart(document.getElementById("salesChart"), {
    type: "bar",
    data: {
      labels: barLabels,
      datasets: [{
        data: barValues,
        backgroundColor: "#F97316",
        borderRadius: 6,
        maxBarThickness: 44
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function (ctx) {
              return " Penjualan: Rp " + Number(ctx.parsed.y).toLocaleString("id-ID");
            }
          }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          grid: { color: "#F1E7DB" },
          ticks: {
            callback: function (value) { return "Rp" + value; }
          }
        },
        x: { grid: { display: false } }
      }
    }
  });
})();
</script>
<th:block th:replace="~{fragments/admin-layout :: adminScripts}"></th:block>
</body>
</html>
